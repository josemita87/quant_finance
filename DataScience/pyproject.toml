[project]
name = "data-science-portfolio"
version = "0.1.0"
description = "Monte Carlo simulations for portfolio risk analysis"
readme = "README.md"
authors = [
    { name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monte_carlo_methods"]
