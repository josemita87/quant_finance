[tool.poetry]
name = "data-science-portfolio"
version = "0.1.0"
description = "Monte Carlo simulations for portfolio risk analysis"
authors = ["Josep Cubedo Macian <136491450+josemita87@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "monte_carlo_methods", from = "src"}]
include = ["src/monte_carlo_methods/data/*.csv"]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
pandas = "^2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
