[project]
name = "financial-math"
version = "0.1.0"
description = "Efficient frontier visualization with a risk-free asset"
readme = "README.md"
authors = [
    { name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_math"]
