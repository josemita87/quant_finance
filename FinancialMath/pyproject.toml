[tool.poetry]
name = "financial-math"
version = "0.1.0"
description = "Efficient frontier visualization with a risk-free asset"
authors = ["Josep Cubedo Macian <136491450+josemita87@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "financial_math", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
matplotlib = "^3.8"
scipy = "^1.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
