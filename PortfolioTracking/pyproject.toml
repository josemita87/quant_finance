[tool.poetry]
name = "portfolio-tracking"
version = "0.1.0"
description = "CLI utilities for tracking personal investment portfolios"
authors = ["Josep Cubedo Macian <136491450+josemita87@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "portfolio_tracking", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
matplotlib = "^3.8"
pandas = "^2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
