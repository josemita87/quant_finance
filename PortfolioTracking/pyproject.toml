[project]
name = "portfolio-tracking"
version = "0.1.0"
description = "CLI utilities for tracking personal investment portfolios"
readme = "README.md"
authors = [
    { name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_tracking"]
