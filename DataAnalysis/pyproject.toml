[project]
name = "ecran-consulting"
version = "0.1.0"
description = "Strategic Consulting Visualization Framework for ECRAN/AC Marca Case Study"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.0",
    "geopandas>=1.0.0",
    "cartopy>=0.22.0",
]
authors = [
    { name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }
]

[project.scripts]
generate-visualizations = "ecran_consulting.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecran_consulting"]
