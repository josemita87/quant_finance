[tool.poetry]
name = "digit-genetics"
version = "0.1.0"
description = "Genetic algorithm exploration on top of MNIST"
authors = ["Josep Cubedo Macian <136491450+josemita87@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "digit_genetics", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
matplotlib = "^3.8"
numpy = "^1.26"
pillow = "^10.2"
scikit-learn = "^1.4"
scipy = "^1.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
