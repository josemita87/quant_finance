[project]
name = "digit-genetics"
version = "0.1.0"
description = "Genetic algorithm exploration on top of MNIST"
readme = "README.md"
authors = [
    { name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digit_genetics"]
