[tool.poetry]
name = "patent-mcp-server"
version = "0.2.1"
description = "Model Context Protocol server for USPTO patent data"
authors = ["USPTO Patent MCP Server <patent-mcp-server@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
anthropic = ">=0.40.0"
h2 = ">=4.2.0"
httpx = ">=0.28.1"
mcp = {extras = ["cli"], version = ">=1.3.0"}
python-dotenv = ">=1.0.1"
pydantic = ">=2.8.0"
pydantic-settings = ">=2.0.0"
pyngrok = ">=7.0.0"
uvicorn = ">=0.30.0"

[tool.poetry.scripts]
patent-mcp-server = "patent_mcp_server.patents:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
