[project]
name = "patent-mcp-server"
version = "0.2.1"
description = "Model Context Protocol server for USPTO patent data"
readme = "README.md"
authors = [
    { name = "USPTO Patent MCP Server", email = "patent-mcp-server@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "h2>=4.2.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "pyngrok>=7.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
patent-mcp-server = "patent_mcp_server.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_mcp_server"]
