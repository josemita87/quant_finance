[project]
name = "graph-theory-algorithms"
version = "0.1.0"
description = "Algorithms and simulations for graph theory coursework"
readme = "README.md"
authors = [
    { name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gt_algorithms"]
